[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elmer-telegram"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "aiomqtt>=2.0",
    "pydantic-settings>=2.0",
]

[tool.setuptools]
packages = [
    "elmer_telegram",
    "elmer_telegram.handlers",
]

[tool.setuptools.package-dir]
elmer_telegram = "src"
