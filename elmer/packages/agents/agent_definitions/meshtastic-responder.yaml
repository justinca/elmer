# =============================================================
# Meshtastic Auto-Responder Agent
# =============================================================
# Backup/complement to the dedicated MeshtasticService in core.
# The core service handles CalvertCasa messages directly via MQTT
# and routes them through RAG chat. This agent definition exists
# as a reference and for the agent registry.
#
# Primary handling: packages/core/src/services/meshtastic.py
# =============================================================

name: meshtastic-responder
display_name: Meshtastic CalvertCasa Responder

description: >
  Responds to incoming Meshtastic mesh radio messages on the CalvertCasa
  channel. Messages are handled by the dedicated MeshtasticService which
  routes them through RAG chat (including Home Assistant data, propagation,
  station notes). POTA self-spotting is supported as a special command.

model: llama3.1:8b

system_prompt: >
  You respond to Meshtastic mesh radio messages on the CalvertCasa channel.

  CRITICAL CONSTRAINTS:
  - Your response MUST be under 200 bytes (about 200 ASCII characters)
  - Use plain text only — NO markdown, NO formatting, NO asterisks
  - Be extremely concise — telegraph style is fine
  - If you cannot answer briefly, say: "Ask via Telegram for details"

  You have access to Home Assistant data (temperature, weather, doors,
  climate zones), propagation conditions, DX spots, POTA data, and the
  full knowledge base via RAG search.

  Special command: "POTA <park> <freq> <mode>" submits a self-spot.

  You are W0ABE's station — sign responses with "de W0ABE" when
  appropriate for ham radio context.

tools:
  - name: search_knowledge
    description: Search knowledge base for answers to questions
    config:
      sources:
        - docs
        - notes

  - name: call_api
    description: Fetch live data from Elmer APIs
    config:
      allowed_urls:
        - http://localhost:8100/ha/summary
        - http://localhost:8100/ha/state/
        - http://localhost:8100/propagation
        - http://localhost:8100/dx/spots/summary
        - http://localhost:8100/pota/spots

  - name: publish_mqtt
    description: Send response back via Meshtastic MQTT bridge
    config:
      topic: "msh/US/2/json/mqtt/"
      allowed_prefixes:
        - "elmer/"
        - "msh/"

triggers:
  - type: mqtt
    topic: "msh/US/2/json/CalvertCasa/#"
    config:
      debounce_seconds: 10
      payload_filter:
        type: "text"
      description: Respond to CalvertCasa Meshtastic messages (10s debounce)

  - type: api
    config:
      description: On-demand via POST /agents/meshtastic-responder/run

output_channels:
  - mqtt
  - log

config:
  max_response_chars: 200
  callsign: "W0ABE"
  channel_topic: "msh/US/2/json/CalvertCasa/#"
  send_topic: "msh/US/2/json/mqtt/"
  node_id: 2654877601
  ignore_from: "24040934"

enabled: false  # Handled by dedicated MeshtasticService in core
max_concurrent: 2
timeout_seconds: 60
