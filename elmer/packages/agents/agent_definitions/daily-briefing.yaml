# =============================================================
# Daily Briefing Agent
# =============================================================
# Compiles a concise morning summary and sends it to Telegram.
# Covers weather, calendar, propagation, DX activity, and system
# health — designed for a quick phone read with morning coffee.
#
# Triggers:
#   - Schedule: daily at 7am (cron: 0 7 * * *)
#   - API: on-demand via POST /agents/daily-briefing/run
#
# To customize:
#   - Adjust cron schedule for your timezone/preference
#   - Add/remove data sources in the system prompt
#   - Change the model for more detailed or concise briefings
# =============================================================

name: daily-briefing
display_name: Daily Briefing

description: >
  Morning briefing agent for W0ABE. Gathers weather, calendar, propagation,
  DX activity, and system health, then composes a concise Telegram summary
  for quick morning review.

model: llama3.1:8b

system_prompt: >
  You are Elmer's daily briefing agent. Your ONLY job is to run ONE script,
  then format its output as a Telegram message.

  STEP 1: Call the run_script tool with script "daily-briefing-data.sh"
  (no arguments). This script gathers ALL data you need — weather, calendar,
  propagation, DX spots, and system health.

  STEP 2: Format the script output into a concise Telegram briefing using
  the sections below. Use ONLY the data returned by the script. If a
  section says "UNAVAILABLE" or "UNREACHABLE", say so — do NOT invent data.

  CRITICAL: NEVER fabricate, guess, or make up any numbers, temperatures,
  conditions, or statistics. Every value in your briefing must come directly
  from the script output. If the script did not return data for a section,
  write "Data unavailable" for that section.

  Sections to include (in this order):

  1. **Weather** — Current conditions (temp, humidity, wind, pressure) and
     forecast high/low from the WEATHER section. This is real data from
     Home Assistant.

  2. **Calendar** — Today's events from the CALENDAR section. List event
     times and summaries. If no events, say "No events today."

  3. **Propagation** — SFI, K-index, and which HF bands are Good/Fair/Poor.
     Suggest the best band based on conditions.

  4. **DX Activity** — Total spots last hour, top bands, modes.

  5. **System Health** — Which nodes are online/offline. Flag any resource
     concerns (disk >80%, high memory usage).

  Format for Telegram (Markdown):
  - Bold headers for each section
  - 2-3 lines per section max
  - Total under 1200 characters
  - Use circle emoji for status: green=good, yellow=warning, red=bad

tools:
  - name: run_script
    description: Run the daily briefing data collection script
    config: {}

triggers:
  - type: schedule
    cron: "0 7 * * *"
    config:
      description: Daily morning briefing at 7am

  - type: api
    config:
      description: On-demand via POST /agents/daily-briefing/run

output_channels:
  - telegram
  - log

config:
  timezone: "America/Denver"

enabled: true
max_concurrent: 1
timeout_seconds: 180
