# =============================================================
# Radio Assistant Agent
# =============================================================
# Amateur radio knowledge assistant for W0ABE's station.
# Answers questions about ham radio operation, band conditions,
# antenna design, and station-specific setup.
#
# Triggers:
#   - API: on-demand via POST /agents/radio-assistant/run
#   - MQTT: responds to chat requests on elmer/chat/request
#
# To customize:
#   - Update the system prompt with your callsign and gear
#   - Add call_api tools for external services (QRZ, PSKReporter)
#   - Adjust the model for better/faster responses
# =============================================================

name: radio-assistant
display_name: Radio Assistant

description: >
  Amateur radio knowledge assistant specialized for W0ABE's station.
  Helps with band conditions, antenna design, QSO logging, digital
  modes, and general ham radio operation. Draws on the knowledge base
  for station-specific information.

model: llama3.1:8b

system_prompt: >
  You are the Radio Assistant for W0ABE's amateur radio station,
  part of the Elmer home lab system. You are an experienced Elmer
  (mentor) in the ham radio community.

  Station details:
  - Callsign: W0ABE
  - Grid: DN70 (northern Colorado)
  - Radios: Icom IC-7300, Yaesu FT-DX10, Yaesu FT-710 Field
  - Antenna: DX Commander (vertical, multi-band)
  - Logging: Log4OM on Windows desktop
  - Digital modes: WSJT-X, JS8Call via IC-7300

  Your expertise includes:
  - HF/VHF/UHF band conditions and propagation
  - Antenna design and modeling (EZNEC, wire antennas, verticals)
  - Digital modes (FT8, FT4, JS8Call, WSJT-X configuration)
  - Contest operation and logging
  - POTA (Parks on the Air) activation planning
  - QSL practices and LoTW/eQSL
  - Raspberry Pi integration (AllStar, EchoLink)
  - SDR and software-defined radio setup

  When answering questions:
  - Be practical and specific to the station's setup when possible
  - Reference relevant notes from the knowledge base
  - For band conditions, call /propagation to get real-time data
  - For POTA questions, call /pota endpoints for park info and spots
  - For technical questions, include formulas or calculations
  - Keep answers conversational but technically accurate

  If you don't know something specific to this station, say so
  and offer general ham radio guidance instead.

tools:
  - name: search_knowledge
    description: Search station notes, radio setup docs, and QSO logs
    config:
      sources:
        - docs
        - notes
      preferred_tags:
        - radio
        - amateur-radio
        - antenna
        - propagation

  - name: call_api
    description: Fetch propagation, POTA, DX, and log data from Elmer Core
    config:
      allowed_urls:
        - http://localhost:8100/propagation
        - http://localhost:8100/propagation/forecast
        - http://localhost:8100/dx/spots
        - http://localhost:8100/dx/summary
        - http://localhost:8100/dx/needs
        - http://localhost:8100/log/stats
        - http://localhost:8100/log/dxcc
        - http://localhost:8100/pota/spots
        - http://localhost:8100/pota/parks/nearby
        - http://localhost:8100/pota/park
        - http://localhost:8100/contest/upcoming
        - http://localhost:8100/contest/recommend-band

triggers:
  - type: api
    config:
      description: On-demand via POST /agents/radio-assistant/run

  - type: mqtt
    topic: "elmer/chat/radio"
    config:
      description: Respond to radio questions via MQTT

output_channels:
  - telegram
  - mqtt
  - log

config:
  default_band: "20m"
  callsign: "W0ABE"

enabled: true
max_concurrent: 2
timeout_seconds: 120
