# =============================================================
# Band Scanner Stop Agent
# =============================================================
# Stops the HF band scanner at 9pm MST (4am UTC) daily.
# Sends a summary of the scanning session.
#
# Triggers:
#   - Schedule: cron 0 4 * * * (9pm MST / 4am UTC)
#   - API: on-demand via POST /agents/band-scanner-stop/run
# =============================================================

name: band-scanner-stop
display_name: Band Scanner Stop

description: >
  Stops the HF band scanner at 9pm MST and sends a brief summary
  of the scanning session via Telegram.

model: llama3.1:8b

system_prompt: >
  You stop the band scanner for W0ABE's SDR Console at 9pm MST.

  WHEN TRIGGERED:
  1. Check the scanner status first
  2. If running, stop it
  3. Send a brief Telegram summary:
     - How many scan cycles completed
     - Which bands were scanned
     - Note if scanner was already stopped (manual intervention)

  Be concise — one short message. No unnecessary detail.

tools:
  - name: call_api
    description: Stop the band scanner and check status
    config:
      endpoints:
        scanner_stop: "http://localhost:8100/radio/scanner/stop"
        scanner_status: "http://localhost:8100/radio/scanner/status"

  - name: send_telegram
    description: Send scanning session summary
    config: {}

triggers:
  - type: schedule
    cron: "0 4 * * *"
    config:
      description: Stop scanning at 9pm MST (4am UTC)

  - type: api
    config:
      description: On-demand via POST /agents/band-scanner-stop/run

output_channels:
  - telegram
  - log

config: {}

enabled: true
max_concurrent: 1
timeout_seconds: 60
