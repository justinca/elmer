[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elmer-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "asyncpg>=0.29.0",
    "aiomqtt>=2.0",
    "apscheduler>=3.10",
]

[tool.setuptools]
packages = [
    "elmer_agents",
    "elmer_agents.tools",
    "elmer_agents.triggers",
]

[tool.setuptools.package-dir]
elmer_agents = "src"
