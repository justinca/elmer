[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elmer-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "elmer-common",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "aiomqtt>=2.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "ddgs>=9.0",
    "beautifulsoup4>=4.12",
]

[tool.setuptools]
packages = [
    "elmer_core",
    "elmer_core.models",
    "elmer_core.services",
    "elmer_core.routes",
    "elmer_core.db",
]

[tool.setuptools.package-dir]
elmer_core = "src"

[tool.setuptools.package-data]
"elmer_core.db" = ["*.sql"]
