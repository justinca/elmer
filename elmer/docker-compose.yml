# ============================================================
# Elmer — Docker Compose (NUC deployment)
# ============================================================
# Runs ALONGSIDE the existing NUC Docker Compose stack
# (Home Assistant, Jellyfin, Node-RED, Mosquitto, Music Assistant).
#
# Uses network_mode: host so containers can directly reach:
#   - PostgreSQL ... localhost:5432 (native install, not Docker)
#   - Mosquitto .... localhost:1883 (existing Docker container)
#   - Ollama ....... localhost:11434
#   - Each other ... localhost:<port>
#
# Does NOT manage: PostgreSQL, Mosquitto, Ollama, or the Worker.
# Worker runs on Windows — not included here.
#
# Environment:
#   All services share a single .env at the repo root.
#   Docker reads it via env_file: .env (relative to this file).
#   For local dev: run scripts/sync-env.sh to symlink into packages.
#
# Quick start:
#   cp .env.example .env   # then edit with your values
#   make up                 # or: docker compose up -d --build
# ============================================================

services:

  # --------------------------------------------------------
  # Core API — central gateway for all Elmer services
  # Binds to port 8100 on the host
  # --------------------------------------------------------
  elmer-core:
    build:
      context: .                          # repo root (needs packages/common/ + packages/core/)
      dockerfile: packages/core/Dockerfile
    container_name: elmer-core
    network_mode: host
    env_file: .env
    environment:
      TZ: America/Denver
    volumes:
      - ./docs:/app/docs
      - ./packages/agents/agent_definitions:/app/agent_definitions:ro
      - ./scripts/agent-scripts:/app/agent-scripts:ro
      - /home/justin/.ssh:/root/.ssh:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------
  # Dashboard — Streamlit web UI
  # Binds to port 8501 on the host
  # --------------------------------------------------------
  elmer-dashboard:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
    container_name: elmer-dashboard
    network_mode: host
    env_file: .env
    environment:
      TZ: America/Denver
      ELMER_CORE_HOST: localhost
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      elmer-core:
        condition: service_healthy

  # --------------------------------------------------------
  # Dashboard UI — React web dashboard
  # Binds to port 3001 on the host
  # --------------------------------------------------------
  elmer-dashboard-ui:
    build:
      context: ./packages/dashboard-ui
      dockerfile: Dockerfile
    container_name: elmer-dashboard-ui
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      elmer-core:
        condition: service_healthy

  # --------------------------------------------------------
  # Telegram Bot — chat interface to Elmer
  # No port binding (outbound only to Telegram API)
  # --------------------------------------------------------
  elmer-telegram:
    build:
      context: .                          # repo root (needs packages/common/ + packages/telegram-bot/)
      dockerfile: packages/telegram-bot/Dockerfile
    container_name: elmer-telegram
    network_mode: host
    env_file: .env
    environment:
      TZ: America/Denver
    restart: unless-stopped
    depends_on:
      elmer-core:
        condition: service_healthy

  # --------------------------------------------------------
  # Knowledge — RAG pipeline & Obsidian sync scheduler
  # Vault access goes through the Worker API (Windows).
  # Runs periodic incremental syncs (default every 1 hour).
  # Also needs PostgreSQL (native, localhost:5432).
  # --------------------------------------------------------
  elmer-knowledge:
    build:
      context: .
      dockerfile: packages/knowledge/Dockerfile
    container_name: elmer-knowledge
    network_mode: host
    env_file: .env
    environment:
      TZ: America/Denver
      ELMER_DOCS_PATH: /data/docs
    volumes:
      - ./docs:/data/docs:ro
    restart: unless-stopped
    depends_on:
      elmer-core:
        condition: service_healthy

  # --------------------------------------------------------
  # Transcription — watches for audio files, sends to worker
  # Mounts ~/elmer/audio/inbox and ~/elmer/audio/processed
  # --------------------------------------------------------
  elmer-transcription:
    build:
      context: .
      dockerfile: packages/transcription/Dockerfile
    container_name: elmer-transcription
    network_mode: host
    env_file: .env
    environment:
      TZ: America/Denver
      TRANSCRIPTION_WATCH_DIR: /data/inbox
      TRANSCRIPTION_PROCESSED_DIR: /data/processed
    volumes:
      - ./audio/inbox:/data/inbox
      - ./audio/processed:/data/processed
    restart: unless-stopped
    depends_on:
      elmer-core:
        condition: service_healthy

volumes:
  elmer-data:
    name: elmer-data
